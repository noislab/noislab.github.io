<header>
  <div class="container">
    <h1><a href="{{ '/' | relative_url }}" style="color:#fff;text-decoration:none;">{{ site.title }}</a></h1>
    <button class="menu-toggle" onclick="document.querySelector('nav').classList.toggle('open')" aria-label="Menu">☰</button>
    <nav>
      <a href="{{ '/'                  | relative_url }}"{% if page.active == 'home'         %} class="active"{% endif %}>Home</a>
      <a href="{{ '/team.html'         | relative_url }}"{% if page.active == 'team'         %} class="active"{% endif %}>Team</a>
      <a href="{{ '/publications.html' | relative_url }}"{% if page.active == 'publications' %} class="active"{% endif %}>Publications</a>
      <a href="{{ '/news.html'         | relative_url }}"{% if page.active == 'news'         %} class="active"{% endif %}>News</a>
      <a href="{{ '/contact.html'      | relative_url }}"{% if page.active == 'contact'      %} class="active"{% endif %}>Contact</a>
    </nav>
  </div>
</header>
