{% assign profile_label = include.label | downcase %}
{% if profile_label contains "linkedin" %}
<svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true">
  <path fill="currentColor" d="M5.34 7.43A2.06 2.06 0 1 0 5.34 3.3a2.06 2.06 0 0 0 0 4.13ZM3.56 20.45h3.56V9H3.56v11.45ZM9.35 9v11.45h3.55v-5.67c0-1.49.28-2.94 2.14-2.94 1.82 0 1.85 1.71 1.85 3.04v5.57h3.56v-6.29c0-3.08-.67-5.45-4.27-5.45-1.73 0-2.89.95-3.37 1.85h-.05V9H9.35Z"></path>
</svg>
{% elsif profile_label contains "orcid" %}
<svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true">
  <circle cx="12" cy="12" r="10" fill="currentColor"></circle>
  <circle cx="8" cy="7.6" r="1.25" fill="#fff"></circle>
  <path d="M8 10.5v6.2M11.5 10.5v6.2h2.2a3.1 3.1 0 0 0 0-6.2h-2.2Z" fill="none" stroke="#fff" stroke-width="1.7"></path>
</svg>
{% elsif profile_label contains "researchgate" %}
<svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true">
  <rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"></rect>
  <text x="3.7" y="16.2" fill="#fff" font-family="Arial, sans-serif" font-size="10.5" font-weight="700">RG</text>
</svg>
{% elsif profile_label contains "scholar" %}
<svg class="profile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="m3 9 9-5 9 5-9 5-9-5Z"></path>
  <path d="M7 12v4c2.8 2.1 7.2 2.1 10 0v-4M21 9v6"></path>
</svg>
{% else %}
<svg class="profile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M14 5h5v5M19 5l-8 8"></path>
  <path d="M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path>
</svg>
{% endif %}
