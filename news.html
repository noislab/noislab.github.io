---
layout: page
title: News
active: news
---

{% comment %} Edit news in _data/news.yml — newest first. {% endcomment %}
<section>
  <div class="container">
    <div class="news-grid">
      {% for item in site.data.news %}
      <div class="news-card">
        <div class="news-date">{{ item.date | date: "%B %Y" }}</div>
        <h3>{{ item.title }}</h3>
        <p>{{ item.body }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
